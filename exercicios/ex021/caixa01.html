<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixa</title>
    <style> 
        h1 {
            background-color: aquamarine;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: rgba(11, 135, 93, 0.516);
            padding: 5px;
            margin: auto;
            outline-width: 5px;
            outline-style: dashed;
            outline-color: blue;
        }

        a {
            border-width: 10px;
            border-style: solid;
            border-color: red;
            padding: 5px;
            margin: 2px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box level</h1>
    <p>Paragrafos são exemplos de box-level mas <a href="#">links são exemplos de inline-level</a>. Mas vamos ver como funciona</p>
</body>
</html>
