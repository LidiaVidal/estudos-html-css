<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;

        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: blue;
            text-decoration: underline;
        }

        .especial::before {
            content: '→';
        }

        .especial::after {
            content: '☜';
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://olenastarodubets.com/guerreira-fit-3-2/">Treinos</a></li>
        <li><a href="https://www.cursoemvideo.com/" class="especial">Estudo de programação</a></li>
        <li><a href="https://www.youtube.com/c/BibleProjectPortugu%C3%AAs">Estudo da bíblia</a></li>
    </ul>
    
</body>
</html>
