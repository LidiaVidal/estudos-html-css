<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudos-classes</title>
    <style>
        div {
            display: inline-block;
            background-color: rgb(223, 176, 143);
            text-align: center;
            border: 1px solid rgb(136, 57, 1);
            height: 200px;
            width: 200px;
        }

        div:hover {
            background-color: red;
        }

    </style>
</head>
<body>
    <div id="d1">
        01
    </div>
    <div id="d2">
        02
    </div>
    <div id="d3">
        03
